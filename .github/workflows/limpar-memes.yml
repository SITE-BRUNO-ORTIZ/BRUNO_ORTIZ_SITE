name: Limpar memes vencidos

on:
  schedule:
    - cron: "17 3 * * *"   # todo dia às 00:17 de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apagar memes com mais de 5 dias
        run: python .github/scripts/limpar_memes.py
      - name: Salvar mudanças
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "robo-memes"
            git config user.email "robo-memes@users.noreply.github.com"
            git add -A memes
            git commit -m "Remove memes vencidos"
            git push
          else
            echo "Nada para remover hoje."
          fi
