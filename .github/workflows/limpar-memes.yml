name: Memes - baixar posts novos e limpar vencidos

on:
  schedule:
    - cron: "17 3 * * *"    # todo dia às 00:17 de Brasília
    - cron: "17 15 * * *"   # e às 12:17 de Brasília
  push:
    branches: [main]
    paths: ["memes/memes.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memes
  cancel-in-progress: false

jobs:
  memes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apagar posts com mais de 5 dias
        run: python .github/scripts/limpar_memes.py
      - name: Baixar para o site a mídia dos posts de hoje e de amanhã
        run: python .github/scripts/baixar_midias_memes.py
      - name: Salvar mudanças
        run: |
          if [ -n "$(git status --porcelain memes)" ]; then
            git config user.name "robo-memes"
            git config user.email "robo-memes@users.noreply.github.com"
            git add -A memes
            git commit -m "Memes: baixa posts novos e remove vencidos"
            for i in 1 2 3; do git push && break; sleep 5; git pull --rebase; done
          else
            echo "Nada para mudar agora."
          fi
